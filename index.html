<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KU Week 01 — Camera & Mic Test</title><style>body{font-family:system-ui,sans-serif;max-width:850px;margin:24px auto;padding:0 16px;color:#172b40}button{padding:10px 14px;margin:4px;border:1px solid #abc;border-radius:8px;background:#f5f9ff;cursor:pointer}video{width:100%;max-width:600px;background:#111;border-radius:10px}pre{background:#f1f4f8;padding:14px;white-space:pre-wrap;overflow-wrap:anywhere}#status{font-weight:600}small{color:#596779}</style></head><body><h2>Week 01 — Camera & Microphone Test</h2><p>ทดสอบการเข้าถึงอุปกรณ์บน GitHub Pages (HTTPS) โดยไม่บันทึกหรือส่งภาพและเสียงไปยังเซิร์ฟเวอร์</p><p><button id="camera">ทดสอบกล้อง</button><button id="mic">ทดสอบไมโครโฟน</button><button id="both">ทดสอบพร้อมกัน</button><button id="stop">หยุดทั้งหมด</button></p><p id="status" role="status">ยังไม่เริ่มทดสอบ</p><video id="preview" autoplay muted playsinline></video><p id="level">ระดับเสียง: —</p><pre id="log" aria-label="บันทึกการทดสอบ"></pre><small>หากอุปกรณ์ไม่ทำงาน ตรวจสิทธิ์ Camera/Microphone ในเบราว์เซอร์และระบบปฏิบัติการ ไม่ต้องใช้บัญชี Google หรือ Firebase สำหรับหน้านี้</small><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let stream=null,ctx=null,source=null,analyser=null,raf=0;const log=s=>{$('log').textContent+=new Date().toLocaleTimeString()+' '+s+'\n'};async function stop(){cancelAnimationFrame(raf);if(source){try{source.disconnect()}catch(e){}source=null}if(ctx){try{await ctx.close()}catch(e){}ctx=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('preview').srcObject=null;$('level').textContent='ระดับเสียง: —';$('status').textContent='หยุดตรวจแล้ว'}async function start(video,audio){await stop();if(!navigator.mediaDevices?.getUserMedia){$('status').textContent='เบราว์เซอร์ไม่รองรับ getUserMedia';return}try{stream=await navigator.mediaDevices.getUserMedia({video,audio});$('preview').srcObject=video?stream:null;$('status').textContent='เปิดสำเร็จ: '+stream.getTracks().map(t=>t.kind).join(', ');log('OK '+stream.getTracks().map(t=>t.kind).join(', '));if(audio){ctx=new (window.AudioContext||window.webkitAudioContext)();source=ctx.createMediaStreamSource(stream);analyser=ctx.createAnalyser();analyser.fftSize=2048;source.connect(analyser);const a=new Uint8Array(analyser.fftSize);function tick(){analyser.getByteTimeDomainData(a);let sum=0;for(let i=0;i<a.length;i++){const x=(a[i]-128)/128;sum+=x*x}const rms=Math.sqrt(sum/a.length);$('level').textContent='ระดับเสียง RMS: '+rms.toFixed(3)+' (ไม่ใช่การตรวจจับคำพูด)';raf=requestAnimationFrame(tick)}tick()}}catch(e){$('status').textContent='เปิดไม่สำเร็จ: '+e.name;log('ERROR '+e.name+': '+e.message)}}$('camera').onclick=()=>start(true,false);$('mic').onclick=()=>start(false,true);$('both').onclick=()=>start(true,true);$('stop').onclick=()=>{stop();log('STOP')};window.addEventListener('pagehide',()=>{if(stream)stream.getTracks().forEach(t=>t.stop())})})();
</script></body></html>
